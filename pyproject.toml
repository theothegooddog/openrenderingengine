[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openrenderingengine"
version = "0.1.0"
description = "Rendering engine for openphysicsengine (Python port of RIM)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["glfw", "PyOpenGL", "numpy", "Pillow"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["openrenderingengine"]

[tool.setuptools.package-data]
openrenderingengine = ["shaders/*"]
